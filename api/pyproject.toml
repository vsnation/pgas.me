[project]
name = "pgasme-api"
version = "0.1.0"
description = "Pgas.me backend — sign-in with Ethereum, destinations, deBridge ingress into the Beam bridge, custodial balance ledger"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "motor>=3.5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "siwe>=4.2",
  "abnf>=2.2,<2.3",  # siwe 4.x grammars break on abnf ≥ 2.3 ('ALPHA' is a core rule…) — pin until siwe catches up
  "eth-account>=0.13",
  "eth-abi>=5.1",
  "eth-utils>=4.1",
  "PyJWT>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "mongomock-motor>=0.0.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pgasme*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # the test posture is pinned in os.environ before pgasme is imported
